name: SafariPlug AI Scout

on:
  schedule:
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:

jobs:
  ai-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run scheduled AI Scout
        env:
          SAFARIPLUG_CRON_SECRET: ${{ secrets.SAFARIPLUG_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SAFARIPLUG_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 900 \
            -H "Authorization: Bearer ${SAFARIPLUG_CRON_SECRET}" \
            "https://safariplug.com/api/cron/ai-scout"
