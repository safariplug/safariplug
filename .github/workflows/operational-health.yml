name: SafariPlug Operational Health

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  operational-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production deployment
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 20); do
            body="$(curl --silent --show-error --max-time 20 https://safariplug.com/api/version || true)"
            if printf '%s' "$body" | grep -q "$GITHUB_SHA"; then
              echo "Production is serving $GITHUB_SHA"
              ready=1
              break
            fi
            echo "Production has not reached $GITHUB_SHA yet (attempt $attempt/20)"
            sleep 15
          done
          test "$ready" -eq 1

      - name: Check live operational health
        run: |
          set -euo pipefail
          token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fsafariplug.com" | jq -r '.value')"
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          status="$(curl --silent --show-error \
            --max-time 60 \
            -o operational-health.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $token" \
            "https://safariplug.com/api/cron/operational-health")"
          cat operational-health.json
          test "$status" -ge 200
          test "$status" -lt 300
