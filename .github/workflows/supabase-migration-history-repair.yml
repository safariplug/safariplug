name: Supabase Migration History Repair

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type repair-verified-history-20260920 to run the verified history-only repair"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: supabase-production-migration-history-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner &&
       inputs.confirmation == 'repair-verified-history-20260920') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.issue.number == 172 &&
       github.event.comment.body == '/repair-verified-history-20260920')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: safcizxahjqassrwhrup
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REPAIR_FILE: ops/supabase/verified-migration-history-repair.txt
      NO_COLOR: "1"
      SUPABASE_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Validate repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret."; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "Missing SUPABASE_DB_PASSWORD repository secret."; exit 1; }
          test -f "${REPAIR_FILE}"

          count="$(grep -Ec '^[0-9]{14}$' "${REPAIR_FILE}")"
          test "${count}" -eq 23 || { echo "Expected 23 verified migration versions, found ${count}."; exit 1; }

          while IFS= read -r version; do
            test -n "${version}" || continue
            matches=(supabase/migrations/"${version}"_*.sql)
            test -e "${matches[0]}" || { echo "Missing local migration file for ${version}."; exit 1; }
            test "${#matches[@]}" -eq 1 || { echo "Expected exactly one local migration file for ${version}."; exit 1; }
          done < "${REPAIR_FILE}"

      - name: Initialize and link Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          supabase link --project-ref "${PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Capture migration history before repair
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "${SUPABASE_DB_PASSWORD}" | tee migration-list-before.txt

      - name: Repair only the verified migration versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(grep -E '^[0-9]{14}$' "${REPAIR_FILE}")
          supabase migration repair "${versions[@]}" \
            --status applied \
            --linked \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Verify migration history after repair
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked --password "${SUPABASE_DB_PASSWORD}" | tee migration-list-after.txt

          failed=0
          while IFS= read -r version; do
            test -n "${version}" || continue
            line="$(grep "${version}" migration-list-after.txt || true)"
            occurrences="$(printf '%s\n' "${line}" | grep -o "${version}" | wc -l | tr -d ' ')"
            if [ "${occurrences}" -lt 2 ]; then
              echo "Version ${version} is not aligned local/remote after repair."
              failed=1
            fi
          done < "${REPAIR_FILE}"

          test "${failed}" -eq 0

      - name: Preserve before/after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-history-repair-${{ github.run_id }}
          path: |
            migration-list-before.txt
            migration-list-after.txt
          if-no-files-found: warn
          retention-days: 30
