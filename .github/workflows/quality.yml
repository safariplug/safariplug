name: SafariPlug Quality

on:
  push:
    branches:
      - integration/travel-os-validation-20260904
  pull_request:
    branches:
      - integration/travel-os-validation-20260904

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
