name: SafariPlug Quality

on:
  push:
    branches:
      - integration/travel-os-validation-20260904
  pull_request:
    branches:
      - integration/travel-os-validation-20260904

permissions:
  contents: read

env:
  # The build imports browser/server configuration while collecting routes.
  # CI only needs syntactically valid placeholders; production credentials
  # remain in the production environment and are never stored in Git.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  OPENAI_API_KEY: ci-placeholder-openai-key

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
