name: Reconcile supplier branch

on:
  push:
    branches:
      - reconcile/supplier-onboarding-20260907

permissions:
  contents: write

jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge supplier work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/supplier-onboarding-20260907
          git merge --no-edit -X theirs origin/feature/supplier-onboarding-20260907 -m "chore: reconcile supplier work onto current main [skip ci]"
      - name: Push reconciled branch
        run: git push origin HEAD:reconcile/supplier-onboarding-20260907
