name: SafariPlug Supplier Scout

on:
  schedule:
    - cron: "0 15 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  supplier-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call SafariPlug with GitHub OIDC
        run: |
          set -euo pipefail
          token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fsafariplug.com" | jq -r '.value')"
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error \
            --max-time 900 \
            -H "Authorization: Bearer $token" \
            "https://safariplug.com/api/cron/supplier-scout"
