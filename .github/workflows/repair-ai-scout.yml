name: One-time AI Scout Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply AI Scout reliability patch
        run: node scripts/repair-ai-scout.js

      - name: Commit repaired Scout implementation and remove repair tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/ai-scout/actions/run-scout.ts
          git rm -f scripts/repair-ai-scout.js .github/workflows/repair-ai-scout.yml
          git commit -m "Fix AI Scout pass failure handling"
          git push
