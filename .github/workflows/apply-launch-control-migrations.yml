name: Apply SafariPlug Launch-Control Migrations

on:
  push:
    branches:
      - ops/apply-launch-control-migrations
    paths:
      - ".github/workflows/apply-launch-control-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safariplug-production-launch-control-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_REF: safcizxahjqassrwhrup
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DISABLE_TELEMETRY: "1"
      NO_COLOR: "1"

    steps:
      - name: Check out exact migration branch
        uses: actions/checkout@v4
        with:
          ref: ops/apply-launch-control-migrations

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Validate production inputs and exact files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_PASSWORD"
          test "$PROJECT_REF" = "safcizxahjqassrwhrup"
          test -f supabase/migrations/20261008005000_production_payment_proofs.sql
          test -f supabase/migrations/20261008012000_production_launch_checks.sql
          npm run validate:migrations

      - name: Discover production session pooler
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          pooler=""
          for region in \
            us-east-1 us-east-2 us-west-1 us-west-2 \
            eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1 \
            ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 \
            ca-central-1 sa-east-1
          do
            host="aws-0-${region}.pooler.supabase.com"
            echo "Checking Supabase session pooler in ${region}"
            if psql "host=${host} port=5432 dbname=postgres user=postgres.${PROJECT_REF} sslmode=require connect_timeout=5" -Atc "select 1" >/dev/null 2>&1; then
              pooler="$host"
              break
            fi
          done
          test -n "$pooler" || { echo "Could not locate reachable SafariPlug Supabase session pooler."; exit 1; }
          echo "Using session pooler: $pooler"
          encoded_password="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          echo "::add-mask::$encoded_password"
          echo "DB_URL=postgresql://postgres.${PROJECT_REF}:${encoded_password}@${pooler}:5432/postgres?sslmode=require" >> "$GITHUB_ENV"
      - name: Preflight target objects
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --db-url "$DB_URL" "select to_regclass('public.production_payment_proofs') as payment_proofs, to_regclass('public.production_launch_checks') as launch_checks;"

      - name: Apply only launch-control schema
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20261008005000_production_payment_proofs.sql \
            supabase/migrations/20261008012000_production_launch_checks.sql
          do
            echo "Applying $file"
            sql="$(cat "$file")"
            supabase db query --db-url "$DB_URL" "$sql"
          done

      - name: Normalize only these two migration history entries
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair \
            20261008005000 \
            20261008012000 \
            --db-url "$DB_URL" \
            --status applied

      - name: Verify launch-control schema
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db query --db-url "$DB_URL" "select to_regclass('public.production_payment_proofs') is not null as payment_proofs_exists, to_regclass('public.production_launch_checks') is not null as launch_checks_exists, (select count(*) from public.production_launch_checks) as launch_check_rows;")"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "true"
          printf '%s\n' "$output" | grep -Eq '(^|[^0-9])6([^0-9]|$)'

      - name: Verify remote migration history contains target versions
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$DB_URL" | tee migration-list.txt
          grep -q "20261008005000" migration-list.txt
          grep -q "20261008012000" migration-list.txt
