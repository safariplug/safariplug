name: SafariPlug AI Scout Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-scout-worker.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Production polling is owned by Supabase pg_cron every minute. This workflow
# remains available only for explicit/manual recovery so two schedulers do not
# race the same Scout jobs.
concurrency:
  group: safariplug-ai-scout-worker
  cancel-in-progress: false

jobs:
  ai-scout-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call SafariPlug with GitHub OIDC
        run: |
          set -euo pipefail
          token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fsafariplug.com" | jq -r '.value')"
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -H "Authorization: Bearer $token" \
            "https://safariplug.com/api/cron/ai-scout/worker"
